<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #hk {
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: transparent;
    }

    #hk:hover {
      background: rgba(0, 0, 0, 0.01);
    }
  </style>
</head>
<body>
  <div id="hk"></div>
  <script>
    (function () {
      var hk = document.getElementById("hk");
      hk.addEventListener("mousedown", function (e) {
        e.preventDefault();
        window.focus();
      });

      var mirrors = [
        "https://cdn.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://quantil.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://gcore.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://originfastly.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://fastly.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://testingcf.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://jsdelivr.b-cdn.net/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://jsd.onmicrosoft.cn/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://cdn.jsdmirror.com/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://cdn.statically.io/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://cdn.staticdelivr.com/gh/s0n-1m-cr1n3/sc13nc3/main/assets/index.html",
        "https://jsd-proxy.ygxz.in/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://jsd.nmmsl.top/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://cdn.bili33.top/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://jsd.proxy.aks.moe/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html",
        "https://js.cdn.haah.net/gh/s0n-1m-cr1n3/sc13nc3@main/assets/index.html"
      ];

      function tryMirror(i) {
        if (i >= mirrors.length) {
          var errorHtml = `
            <!DOCTYPE html>
            <html>
                <p>oops I guess it didn't load. Try again.</p>
            </html>
          `;
          document.open();
          document.write(errorHtml);
          document.close();
          return;
        }
        
        fetch(mirrors[i], { cache: 'no-store' }).then(function (r) {
          if (!r.ok) throw 0;
          return r.text();
        }).then(function (html) {
          document.open();
          document.write(html);
          document.close();
        }).catch(function () { 
          tryMirror(i + 1); 
        });
      }

      tryMirror(0);
    })();
  </script>
</body>
</html>
