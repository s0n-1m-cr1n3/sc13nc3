<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home - Classroom</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f0d; }
  p {
    position: fixed; left: 0; right: 0; top: 50%; margin: 0;
    transform: translateY(-50%); text-align: center;
    font: 500 13px system-ui, sans-serif; color: #888;
  }
</style>
</head>
<body>
<p id="status">Loading...</p>
<script>
(function () {
  var status = document.getElementById("status");
  function show(message) {
    if (status) status.textContent = message;
  }
  var base = new URL(".", location.href);
  var app = new URL("ubzlol", base).href;
  var sw = new URL("sw.js", base).href;
  var done = false;

  function whenControlled() {
    return new Promise(function (resolve) {
      if (navigator.serviceWorker.controller) {
        try { sessionStorage.removeItem("ubzBootRetry"); } catch (e) {}
        resolve(true);
        return;
      }
      var settled = false;
      function finish(value) {
        if (settled) return;
        settled = true;
        if (value) { try { sessionStorage.removeItem("ubzBootRetry"); } catch (e) {} }
        resolve(value);
      }
      navigator.serviceWorker.addEventListener("controllerchange", function () { finish(true); });
      setTimeout(function () { finish(!!navigator.serviceWorker.controller); }, 2500);
    });
  }

  function go() {
    if (done) return;
    done = true;
    location.replace(app + location.search + location.hash);
  }

  if (!("serviceWorker" in navigator)) {
    show("Loading...");
    return;
  }

  show("Loading...");
  navigator.serviceWorker.register(sw, { scope: base.href, updateViaCache: "none" })
    .then(function (reg) {
      return navigator.serviceWorker.ready.then(function () { return reg; });
    })
    .then(function () {
      // An active worker is not the same thing as a controlled page: on a first visit
      // the hop to /ubzlol could happen while this document was still uncontrolled, and
      // the CDN then answered 404 for that path. Wait for control instead of for state.
      return whenControlled().then(function (controlled) {
        if (controlled) {
          go();
          return;
        }
        // Registered but never claimed us: one reload runs this again with it in control.
        try {
          if (!sessionStorage.getItem("ubzBootRetry")) {
            sessionStorage.setItem("ubzBootRetry", "1");
            location.reload();
            return;
          }
        } catch (e) {}
        go();
      });
    })
    .catch(function (err) {
      show("Load failed: " + (err && err.message ? err.message : err));
    });
})();
</script>
</body>
</html>
